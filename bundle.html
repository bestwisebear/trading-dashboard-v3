// ============ COMPONENTS ============

function FreshnessBadge({ fresh }) {
  const cls = fresh === 'green' ? 'fresh-green' : fresh === 'yellow' ? 'fresh-yellow' : 'fresh-dark';
  const dot = fresh === 'green' ? '🟢' : fresh === 'yellow' ? '🟡' : '⚫';
  return <span className={`text-xs ${cls} font-mono`}>{dot} {fresh === 'green' ? '<15min' : fresh === 'yellow' ? '15-30min' : '>30min'}</span>;
}

function StatusDot({ status }) {
  return <span className={`signal-dot signal-${status}`}></span>;
}

function Card({ children, className = "", onClick }) {
  return (
    <div className={`glass rounded-lg p-4 transition-all duration-200 ${onClick ? 'cursor-pointer glass-hover' : ''} ${className}`} onClick={onClick}>
      {children}
    </div>
  );
}

function StatValue({ value, color }) {
  const colorMap = { rise: 'text-rise', fall: 'text-fall', warn: 'text-warn', info: 'text-info', muted: 'text-text-secondary' };
  return <span className={`font-mono font-semibold ${colorMap[color] || 'text-text-primary'}`}>{value}</span>;
}

function MiniChart({ data, maxVal = 5 }) {
  const w = 200, h = 50, pad = 4;
  const pts = data.map((d, i) => {
    const x = pad + (i / (data.length - 1)) * (w - pad * 2);
    const y = h - pad - (d.count / maxVal) * (h - pad * 2);
    return `${x},${y}`;
  });
  return (
    <svg width={w} height={h} className="w-full">
      <polyline points={pts.join(' ')} fill="none" stroke="#3B82F6" strokeWidth="2" className="chart-line" />
      {data.map((d, i) => {
        const x = pad + (i / (data.length - 1)) * (w - pad * 2);
        const y = h - pad - (d.count / maxVal) * (h - pad * 2);
        return <circle key={i} cx={x} cy={y} r="3" fill="#3B82F6" />;
      })}
      {data.map((d, i) => {
        const x = pad + (i / (data.length - 1)) * (w - pad * 2);
        return <text key={i} x={x} y={h - 2} textAnchor="middle" fill="#64748B" fontSize="8" fontFamily="Fira Code">{d.date}</text>;
      })}
    </svg>
  );
}

function BarChart({ data }) {
  const maxVal = Math.max(...Object.values(data));
  return (
    <div className="flex items-end gap-1 h-20">
      {Object.entries(data).map(([k, v]) => (
        <div key={k} className="flex flex-col items-center flex-1">
          <span className="text-[9px] text-text-muted font-mono mb-1">{v}</span>
          <div className="w-full bg-rise/70 rounded-t" style={{ height: `${(v / maxVal) * 100}%`, minHeight: '4px' }}></div>
          <span className="text-[8px] text-text-muted mt-1 truncate w-full text-center">{k.split('-')[0]}</span>
        </div>
      ))}
    </div>
  );
}

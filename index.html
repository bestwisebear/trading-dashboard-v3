function useDataLoader(selectedDate) {
  const [data, setData] = useState({});
  const [loading, setLoading] = useState(true);
  const [errors, setErrors] = useState({});
  const [lastFetch, setLastFetch] = useState({});
  const getDataPrefix = useCallback(() => {
    if (!selectedDate || selectedDate === 'today') return BASE_DATA;
    return HISTORY_DATA + '/' + selectedDate;
  }, [selectedDate]);
  const fetchAll = useCallback(async () => {
    setLoading(true);
    setErrors({});
    const prefix = getDataPrefix();
    const entries = Object.entries(DATA_URLS).map(([key, url]) => [key, prefix + '/' + url.split('/').pop()]);
    const results = {};
    const errs = {};
    const timestamps = {};
    await Promise.all(entries.map(async ([key, url]) => {
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const text = await res.text();
        const json = JSON.parse(text);
        results[key] = json;
        timestamps[key] = json.meta?.last_updated || new Date().toISOString();
      } catch (e) {
        errs[key] = e.message;
        console.error(`Failed to fetch ${key}:`, e);
      }
    }));

    // Apply embedded fallback for missing data
    if (!results.fundamentals) {
      timestamps.fundamentals = new Date().toISOString();
    }
    if (!results.news_impact) {
      timestamps.news_impact = new Date().toISOString();
    }
    setData(results);
    setErrors(errs);
    setLastFetch(timestamps);
    setLoading(false);
  }, [getDataPrefix]);
  const fetchOne = useCallback(async key => {
    try {
      const prefix = getDataPrefix();
      const url = prefix + '/' + DATA_URLS[key].split('/').pop();
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const json = await res.json();
      setData(prev => ({
        ...prev,
        [key]: json
      }));
      setErrors(prev => {
        const n = {
          ...prev
        };
        delete n[key];
        return n;
      });
      setLastFetch(prev => ({
        ...prev,
        [key]: json.meta?.last_updated || new Date().toISOString()
      }));
    } catch (e) {
      setErrors(prev => ({
        ...prev,
        [key]: e.message
      }));
    }
  }, []);
  useEffect(() => {

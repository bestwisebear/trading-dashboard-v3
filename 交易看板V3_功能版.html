// ============ DATA FETCHING HOOK ============
function useDataLoader(selectedDate) {
  const [data, setData] = useState({});
  const [loading, setLoading] = useState(true);
  const [errors, setErrors] = useState({});
  const [lastFetch, setLastFetch] = useState({});

  const getDataPrefix = useCallback(() => {
    if (!selectedDate || selectedDate === 'today') return BASE_DATA;
    return HISTORY_DATA + '/' + selectedDate;
  }, [selectedDate]);

  const fetchAll = useCallback(async () => {
    setLoading(true);
    setErrors({});
    const prefix = getDataPrefix();
    const entries = Object.entries(DATA_URLS).map(([key, url]) => [key, prefix + '/' + url.split('/').pop()]);
    const results = {};
    const errs = {};
    const timestamps = {};

    await Promise.all(entries.map(async ([key, url]) => {
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const text = await res.text();
        const json = JSON.parse(text);
        results[key] = json;
        timestamps[key] = json.meta?.last_updated || new Date().toISOString();
      } catch (e) {
        errs[key] = e.message;
        console.error(`Failed to fetch ${key}:`, e);
      }
    }));

    // Apply embedded fallback for missing data
    if (!results.fundamentals) { timestamps.fundamentals = new Date().toISOString(); }
    if (!results.news_impact) { timestamps.news_impact = new Date().toISOString(); }
    setData(results);
    setErrors(errs);
    setLastFetch(timestamps);
    setLoading(false);
  }, [getDataPrefix]);

  const fetchOne = useCallback(async (key) => {
    try {
      const prefix = getDataPrefix();
      const url = prefix + '/' + DATA_URLS[key].split('/').pop();
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const json = await res.json();
      setData(prev => ({ ...prev, [key]: json }));
      setErrors(prev => { const n = {...prev}; delete n[key]; return n; });
      setLastFetch(prev => ({ ...prev, [key]: json.meta?.last_updated || new Date().toISOString() }));
    } catch (e) {
      setErrors(prev => ({ ...prev, [key]: e.message }));
    }
  }, []);

  useEffect(() => { fetchAll(); }, [fetchAll, selectedDate]);

  return { data, loading, errors, lastFetch, fetchAll, fetchOne };
}


// ============ DATE SELECTOR ============
function DateSelector({ selectedDate, setSelectedDate, availableDates }) {
  const [isOpen, setIsOpen] = useState(false);
  
  const formatDate = (dateStr) => {
    const d = new Date(dateStr + 'T00:00:00+08:00');
    const today = new Date();
    today.setHours(0,0,0,0);
    const diff = Math.round((today - d) / 86400000);
    const weekdays = ['日','一','二','三','四','五','六'];
    const wd = '周' + weekdays[d.getDay()];
    if (diff === 0) return '今天';
    if (diff === 1) return '昨天';
    if (diff === 2) return '前天';
    return dateStr.slice(5) + ' ' + wd;
  };

  const sortedDates = [...(availableDates || [])].sort((a,b) => b.localeCompare(a));
  const currentLabel = selectedDate === 'today' ? '今天' : formatDate(selectedDate);

  return (
    <div className="relative">
      <button onClick={() => setIsOpen(!isOpen)}
        className={`flex items-center gap-1 px-2 py-1 rounded text-xs font-medium transition-colors cursor-pointer ${
          selectedDate !== 'today' ? 'bg-amber-500/20 text-amber-300 border border-amber-500/30' : 'text-slate-400 hover:text-slate-200 hover:bg-slate-700/50'
        }`}>
        {Icons.clock("w-3.5 h-3.5")}
        <span>{currentLabel}</span>
        <svg className="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 9l-7 7-7-7" /></svg>
      </button>
      {isOpen && (
        <div className="absolute right-0 top-full mt-1 bg-slate-800 border border-slate-700 rounded-lg shadow-xl z-50 min-w-[140px] py-1">
          <button onClick={() => { setSelectedDate('today'); setIsOpen(false); }}
            className={`w-full text-left px-3 py-1.5 text-xs hover:bg-slate-700/50 transition-colors ${selectedDate === 'today' ? 'text-cyan-400 font-medium' : 'text-slate-300'}`}>
            📅 今天（最新）
          </button>
          {sortedDates.filter(d => d !== (new Date().toISOString().slice(0,10))).map(date => (
            <button key={date} onClick={() => { setSelectedDate(date); setIsOpen(false); }}
              className={`w-full text-left px-3 py-1.5 text-xs hover:bg-slate-700/50 transition-colors ${selectedDate === date ? 'text-cyan-400 font-medium' : 'text-slate-300'}`}>
              📅 {formatDate(date)}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

function FreshnessBadge({ fresh }) {
  const cls = fresh === 'green' ? 'fresh-green' : fresh === 'yellow' ? 'fresh-yellow' : 'fresh-dark';
  const dot = fresh === 'green' ? Icons.dotGreen('w-2.5 h-2.5') : fresh === 'yellow' ? Icons.dotYellow('w-2.5 h-2.5') : Icons.dotBlack('w-2.5 h-2.5');
  return <span className={`text-[11px] ${cls} font-mono inline-flex items-center gap-1`}>{dot} {fresh === 'green' ? '<15min' : fresh === 'yellow' ? '15-30min' : '>30min'}</span>;
}

function getFreshness(ts) {
  if (!ts) return 'dark';
  const diff = (Date.now() - new Date(ts).getTime()) / 60000;
  if (diff < 15) return 'green';
  if (diff < 60) return 'yellow';
  return 'dark';
}

function MiniChart({ data, maxVal = 5 }) {
  if (!data || data.length === 0) return null;
  const w = 200, h = 50, pad = 4;
  const pts = data.map((d, i) => {
    const x = pad + (i / (data.length - 1)) * (w - pad * 2);
    const y = h - pad - ((d.satisfied_count || d.count || 0) / maxVal) * (h - pad * 2);
    return `${x},${y}`;
  });
  return (
    <svg width={w} height={h} className="w-full">
      <polyline points={pts.join(' ')} fill="none" stroke="#3B82F6" strokeWidth="2" className="chart-line" />
      {data.map((d, i) => {
        const x = pad + (i / (data.length - 1)) * (w - pad * 2);
        const y = h - pad - ((d.satisfied_count || d.count || 0) / maxVal) * (h - pad * 2);
        return <circle key={i} cx={x} cy={y} r="3" fill="#3B82F6" />;
      })}
      {data.map((d, i) => {
        const x = pad + (i / (data.length - 1)) * (w - pad * 2);
        const dateStr = d.date ? d.date.slice(5) : '';
        return <text key={i} x={x} y={h - 2} textAnchor="middle" fill="#64748B" fontSize="11" fontFamily="Fira Code">{dateStr}</text>;
      })}
    </svg>
  );
}

function BarChart({ data }) {
  if (!data) return null;
  const vals = Object.values(data);
  const maxVal = Math.max(...vals, 1);
  return (
    <div className="flex items-end gap-1 h-20">
      {Object.entries(data).map(([k, v]) => (
        <div key={k} className="flex flex-col items-center flex-1">
          <span className="text-[11px] text-text-muted font-mono mb-1">{v}</span>
          <div className="w-full bg-rise/70 rounded-t" style={{ height: `${(v / maxVal) * 100}%`, minHeight: '4px' }}></div>
          <span className="text-[11px] text-text-muted mt-1 truncate w-full text-center">{k.split('-')[0]}</span>
        </div>
      ))}
    </div>
  );
}

function ProgressBar({ percent, color = '#3B82F6' }) {
  const p = Math.min(100, Math.max(0, percent));
  return (
    <div className="progress-bar">
      <div className="progress-fill" style={{ width: `${p}%`, background: color }}></div>
    </div>
  );
}

        <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-2">

        {/* 违规明细 */}
        {(() => {

          const typeLabels = { non_trading_window: '非交易时段', day_trading: '做T违规', out_of_watchlist: '非关注池', skip_candidate_pool: '跳过候选池', exceed_planned_qty: '超计划量', emotional_trading: '情绪交易' };

      )}

      {watchTab === 'buy' && (
        <Card>
          <h3 className="text-sm font-semibold mb-3">可买入票（按风险评分排序）</h3>
          <div className="space-y-2">

      {watchTab === 'oversold' && (
        <div className="space-y-2">
          {os.map(s => (
            <Card key={s.sector_name}>
              <div className="flex items-center justify-between mb-2">
                <div>
                  <span className="text-xs font-semibold text-text-primary">{s.sector_name}</span>
                  <span className="ml-2 badge bg-fall/20 text-fall">20日 {s.change_20d}%</span>
                  <span className="ml-1 badge bg-warn/20 text-warn">5日 {s.change_5d}%</span>
                  {s.added_to_watchlist && <span className="ml-1 badge bg-info/20 text-info">已关注</span>}
                </div>
                <span className={`badge ${s.review_status === 'reviewed' ? 'bg-fall/20 text-fall' : 'bg-text-muted/20 text-text-muted'}`}>
                  {s.review_status === 'reviewed' ? '已复盘' : '待复盘'}
                </span>
              </div>
              {s.review_note && <p className="text-[11px] text-text-secondary mb-2">{s.review_note}</p>}
              <div className="grid grid-cols-3 gap-2">
                {(s.top3_resistant||[]).map(t => (
                  <div key={t.code} className="text-xs p-2 rounded bg-bg-primary/50">
                    <span className="text-text-primary">{t.name}</span>
                    <span className="ml-1 font-mono text-fall">{t.change_20d}%</span>
                    <span className="text-text-muted ml-1">(5d: {t.change_5d}%)</span>
                  </div>
                ))}
              </div>
            </Card>
          ))}
        </div>
      )}

      {false && watchTab === 'scan' && (  /* scan tab disabled - merged into long tab */
        <div className="space-y-4">
          <div className="flex items-center justify-between">
            <div>
              <p className="text-xs text-text-muted">搜索股票代码或名称，查看7道闸评估结果。范围：非ST / 非科创板 / 非北交所</p>
              <p className="text-[10px] text-text-muted mt-1">数据更新: {scanMeta.update_time || '暂无数据'}</p>
            </div>
            <span className="badge bg-info/20 text-info text-[10px]">覆盖 {Object.keys(scanStocks).length} 只</span>
          </div>
          <div className="relative">
            <span className="absolute left-3 top-1/2 -translate-y-1/2 text-text-muted">{Icons.search("w-4 h-4")}</span>
            <input type="text" placeholder="输入代码或名称搜索（如 002558 或 巨人网络）..." value={scanQuery} onChange={e => setScanQuery(e.target.value)}
              className="w-full pl-10 pr-4 py-2.5 bg-bg-card border border-border-main rounded-lg text-sm text-text-primary placeholder-text-muted focus:outline-none focus:border-info transition-colors" />
          </div>
          {scanQuery && (
            <div className="flex gap-2 text-[10px]">
              <span className="text-text-muted">排序:</span>
              {[['score','评分'],['pass','通过数'],['code','代码']].map(([v,l]) => (
                <button key={v} onClick={() => setScanSort(v)}
                  className={`px-2 py-0.5 rounded ${scanSort===v ? 'bg-info/20 text-info' : 'text-text-muted hover:text-text-secondary'}`}>{l}</button>
              ))}
            </div>
          )}

          {scanQuery && scanMatches.length === 0 && (
            <Card className="text-center py-8">
              <p className="text-3xl mb-3">🔍</p>
              <p className="text-sm text-text-primary font-medium mb-1">未找到匹配结果</p>
              <p className="text-xs text-text-muted">该票可能尚未被扫描覆盖，可联系Agent单独分析</p>
            </Card>
          )}

          {(scanQuery ? scanMatches : []).map(([code, s]) => {
            const passedCount = Object.values(s.gates||{}).filter(g => g.pass === true).length;
            const computedCount = Object.values(s.gates||{}).filter(g => g.pass !== null).length;
            const totalScore = s.score || 0;
            const verdictColor = s.verdict === 'pass' ? 'text-fall' : s.verdict === 'conditional' ? 'text-warn' : 'text-rise';
            const verdictBg = s.verdict === 'pass' ? 'bg-fall/10 border-fall/30' : s.verdict === 'conditional' ? 'bg-warn/10 border-warn/30' : 'bg-rise/10 border-rise/30';
            const verdictText = s.verdict === 'pass' ? '✅ 建议买入' : s.verdict === 'conditional' ? '⚠️ 有条件通过' : '❌ 不建议';
            return (
              <Card key={code} className="glass-hover">
                <div className="flex items-center justify-between mb-3">
                  <div className="flex items-center gap-3">
                    <div>
                      <span className="text-sm font-bold text-text-primary">{s.name}</span>
                      <span className="text-xs text-text-muted ml-2 font-mono">{code}</span>
                      <span className="text-xs text-text-muted ml-2">{s.sector||''}</span>
                    </div>
                  </div>
                  <div className={`px-3 py-1.5 rounded-lg border ${verdictBg}`}>
                    <span className={`text-sm font-bold ${verdictColor}`}>{verdictText}</span>
                  </div>
                </div>

                <div className="grid grid-cols-4 md:grid-cols-7 gap-3 mb-3">
                  <div className="text-center p-2 rounded bg-bg-primary/60">
                    <p className="text-lg font-mono font-bold text-text-primary">{s.price||'-'}</p>
                    <p className="text-[10px] text-text-muted">现价</p>
                  </div>
                  <div className="text-center p-2 rounded bg-bg-primary/60">
                    <p className={`text-lg font-mono font-bold ${(s.change_pct||0)>=0?'text-fall':'text-rise'}`}>{s.change_pct||'-'}</p>
                    <p className="text-[10px] text-text-muted">涨跌幅%</p>
                  </div>
                  <div className="text-center p-2 rounded bg-bg-primary/60">
                    <p className="text-lg font-mono font-bold text-warn">{totalScore}</p>
                    <p className="text-[10px] text-text-muted">通过 {passedCount}/{computedCount}</p>
                  </div>
                  <div className="text-center p-2 rounded bg-bg-primary/60">
                    <p className="text-lg font-mono font-bold text-text-primary">{s.pe||'-'}</p>
                    <p className="text-[10px] text-text-muted">PE</p>
                  </div>
                  <div className="text-center p-2 rounded bg-bg-primary/60">
                    <p className="text-lg font-mono font-bold text-text-primary">{s.turnover_rate||'-'}</p>
                    <p className="text-[10px] text-text-muted">换手率%</p>
                  </div>
                  <div className="text-center p-2 rounded bg-bg-primary/60">
                    <p className="text-lg font-mono font-bold text-info">{s.rsi6!=null?s.rsi6.toFixed(1):'-'}</p>
                    <p className="text-[10px] text-text-muted">RSI6</p>
                  </div>
                  <div className="text-center p-2 rounded bg-bg-primary/60">
                    <p className="text-lg font-mono font-bold text-text-primary">{s.capital_flow_3d!=null?(s.capital_flow_3d/10000).toFixed(1)+'亿':'-'}</p>
                    <p className="text-[10px] text-text-muted">3日主力净流</p>
                  </div>
                </div>

                <div className="grid grid-cols-2 sm:grid-cols-4 gap-1 mb-3 text-[10px]">
                  <div><span className="text-text-muted">支撑位 </span><span className="font-mono text-fall">{s.key_price?.support||'-'}</span></div>
                  <div><span className="text-text-muted">买入区间 </span><span className="font-mono text-fall">{(s.key_price?.buy_range||['-','-']).join('-')}</span></div>
                  <div><span className="text-text-muted">阻力位 </span><span className="font-mono text-rise">{s.key_price?.resistance||'-'}</span></div>
                  <div><span className="text-text-muted">止损位 </span><span className="font-mono text-rise">{s.key_price?.stop_loss||'-'}</span></div>
                </div>

                <div className="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-1.5 mb-3">
                  {Object.entries(s.gates||{}).map(([key, gate]) => (
                    <div key={key} className={`p-2 rounded border text-xs ${gate.pass === true ? 'border-fall/30 bg-fall/5' : gate.pass === false ? 'border-rise/30 bg-rise/5' : 'border-border-main/30 bg-bg-primary/30'}`}>
                      <div className="flex items-center gap-1 mb-0.5">
                        <span className={gate.pass === true ? 'text-fall' : gate.pass === false ? 'text-rise' : 'text-text-muted'}>
                          {gate.pass === true ? '✓' : gate.pass === false ? '✗' : '?'}
                        </span>
                        <span className="text-text-muted text-[10px]">{gateLabels[key]||key}</span>
                      </div>
                      <p className="font-mono text-[10px] text-text-secondary">{gate.value||'-'}</p>
                    </div>
                  ))}
                </div>

                {s.note && (
                  <div className="p-2 rounded bg-info/5 border border-info/20 mb-3">
                    <p className="text-[11px] text-info">💡 {s.note}</p>
                  </div>
                )}

                <div className="flex gap-2 pt-2 border-t border-border-main/30">
                  <span className="text-[10px] text-text-muted self-center">💬 如需加入观察池，请告诉Agent："把{code}加入观察池"</span>
                </div>
              </Card>
            );
          })}

          {!scanQuery && (
            <Card className="text-center py-10">
              <p className="text-4xl mb-3">🔍</p>
              <p className="text-sm text-text-primary font-medium mb-2">输入股票代码或名称开始检测</p>
              <p className="text-xs text-text-muted mb-4">每晚23:00自动扫描全市场，预计算7道闸评估结果</p>
              <div className="flex justify-center gap-6 text-xs text-text-muted">
                <span>🚫 排除ST</span>
                <span>🚫 排除科创板(688)</span>
                <span>🚫 排除北交所(8开头)</span>
              </div>
            </Card>
          )}
        </div>
      )}
    </div>
  );
}

// ============ PAGE: DISCIPLINE ============
function DisciplinePage({ riskAssessment, tradesToday, disciplineLog }) {
  const rules = riskAssessment.rule_checks || [];
  const tradeSummary = tradesToday.summary || {};
  const tradeList = tradesToday.trades || [];
  const totalTrades = tradeSummary.total_trades || tradeList.length || 0;
  const buyCount = tradeSummary.buy_count || tradeList.filter(t => (t.action || t.direction) === 'buy').length;
  const sellCount = tradeSummary.sell_count || tradeList.filter(t => (t.action || t.direction) === 'sell').length;
  const netPnl = tradeSummary.realized_pnl || tradeSummary.net_pnl || 0;
  const tradePassed = totalTrades <= 6;

  // 动态计算各项纪律检查
  const now = new Date();
  const h = now.getHours(), m = now.getMinutes();
  const inTradeWindow = (h === 13 && m >= 30) || (h === 14 && m <= 30);
  const isMarketHours = (h === 9 && m >= 30) || (h === 10) || (h === 11 && m <= 30) || (h >= 13 && h < 15);
  const timeWindowDesc = isMarketHours ? (inTradeWindow ? '在开仓窗口内(13:30-14:30)' : '交易时段内，非开仓窗口') : '非交易时段';

  // 做T检测：同日同票有买有卖
  const stockActions = {};
  tradeList.forEach(t => {
    if (!stockActions[t.symbol]) stockActions[t.symbol] = { buy: 0, sell: 0 };
    stockActions[t.symbol][t.direction]++;
  });
  const hasDayTrade = Object.values(stockActions).some(a => a.buy > 0 && a.sell > 0);
  const dayTradeStocks = Object.entries(stockActions).filter(([_, a]) => a.buy > 0 && a.sell > 0).map(([s]) => s);

  // 割肉回补检测：同日先卖(亏损)后买同一票
  let hasLossBuyback = false;
  const sellLosses = tradeList.filter(t => t.direction === 'sell' && t.pnl != null && t.pnl < 0);
  const buyBacks = tradeList.filter(t => t.direction === 'buy');
  sellLosses.forEach(sl => {
    if (buyBacks.some(b => b.symbol === sl.symbol)) hasLossBuyback = true;
  });

  // 涨跌家数检查
  const riseFallRule = rules.find(r => r.rule && r.rule.includes('涨跌家数'));
  const riseFallPassed = riseFallRule ? riseFallRule.passed : true;

  const checks = [
    { label: "持仓上限", desc: `当前${rules.find(r => r.rule && r.rule.includes('持仓'))?.current_value || '-'}/上限4只`, passed: rules.find(r => r.rule && r.rule.includes('持仓'))?.passed !== false },
    { label: "当日笔数", desc: `${totalTrades}笔/上限6笔`, passed: tradePassed },
    { label: "时间窗口", desc: timeWindowDesc, passed: true },
    { label: "做T检测", desc: hasDayTrade ? `⚠ ${dayTradeStocks.join(',')} 同日买卖` : '未检测到做T', passed: !hasDayTrade },
    { label: "割肉回补", desc: hasLossBuyback ? '⚠ 存在割肉后回补' : '无割肉回补', passed: !hasLossBuyback },
    { label: "涨跌>2000", desc: riseFallRule ? riseFallRule.current_value : '-', passed: riseFallPassed },
  ];

  return (
    <div className="space-y-5">
      <Card>
        <h3 className="text-sm font-semibold mb-4">操作纪律检查</h3>
        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
          {checks.map((c, i) => (
            <div key={i} className={`p-3 rounded-lg border ${c.passed ? 'border-fall/30 bg-fall/5' : 'border-rise/30 bg-rise/5'}`}>
              <div className="flex items-center gap-2 mb-1">
                <span className="text-lg">{c.passed ? Icons.circleCheck('w-5 h-5') : Icons.xCircle('w-5 h-5')}</span>
                <span className="text-xs font-semibold text-text-primary">{c.label}</span>
              </div>
              <p className="text-[11px] text-text-muted">{c.desc}</p>
            </div>
          ))}
        </div>
      </Card>

      {totalTrades > 0 && (
        <Card>
          <div className="flex items-center justify-between mb-3">
            <h3 className="text-sm font-semibold">今日交易明细</h3>
            <div className="flex gap-3 text-[11px]">
              <span className="text-text-muted">买 <span className="font-mono font-bold text-rise">{buyCount}</span></span>
              <span className="text-text-muted">卖 <span className="font-mono font-bold text-fall">{sellCount}</span></span>
              <span className="text-text-muted">净盈亏 <span className={`font-mono font-bold ${netPnl >= 0 ? 'text-rise' : 'text-fall'}`}>¥{netPnl.toFixed(2)}</span></span>
            </div>
          </div>
          <div className="space-y-2">
            {tradeList.map((t, i) => {
              const action = t.action || t.direction || 'buy';
              const isBuy = action === 'buy';
              const stockCode = t.code || t.symbol || '';
              const qty = t.quantity || t.qty || 0;
              return (
              <div key={t.seq || t.id || i} className={`flex items-center justify-between p-3 rounded-lg border ${isBuy ? 'border-rise/20 bg-rise/5' : 'border-fall/20 bg-fall/5'}`}>
                <div className="flex items-center gap-3">
                  <span className={`badge ${isBuy ? 'bg-rise/20 text-rise' : 'bg-fall/20 text-fall'}`}>
                    {isBuy ? '买入' : '卖出'}
                  </span>
                  <div>
                    <p className="text-xs font-semibold text-text-primary">{t.name} <span className="font-mono text-text-muted">{stockCode}</span></p>
                    <p className="text-[11px] text-text-muted">{t.time || ''} · {qty}股 @ ¥{t.price}</p>
                  </div>
                </div>
                <div className="text-right">
                  {t.pnl_amount != null && t.pnl_amount !== 0 ? (
                    <p className={`text-xs font-mono font-bold ${(t.pnl_amount||0) >= 0 ? 'text-rise' : 'text-fall'}`}>
                      {(t.pnl_amount||0) >= 0 ? '+' : ''}¥{(t.pnl_amount||0).toFixed(0)}
                    </p>
                  ) : (
                    <p className="text-xs text-text-muted">{isBuy ? '建仓' : '平仓'}</p>
                  )}
                  {t.reason && <p className="text-[11px] text-text-muted mt-0.5 max-w-[160px] text-right">{t.reason}</p>}
                  {t.violation && <p className="text-[10px] text-warn mt-0.5">⚠ {t.violation}</p>}
                </div>
              </div>
              );
            })}
          </div>
        </Card>
      )}

      {/* 买入评估区域 */}
      {(() => {
        const logs = disciplineLog.logs || [];
        const today = new Date().toISOString().slice(0,10);
        const todayLogs = logs.filter(l => l.date === today && l.assessment && l.assessment.conclusion);
        if (todayLogs.length === 0) return null;
        return (
          <Card>
            <h3 className="text-sm font-semibold mb-3">📊 买入评估</h3>
            <div className="space-y-2">
              {todayLogs.map((l, i) => (
                <div key={i} className={`p-3 rounded-lg border ${l.assessment.score && l.assessment.score.includes('/') ? (parseInt(l.assessment.score) >= 5 ? 'border-fall/30 bg-fall/5' : 'border-warn/30 bg-warn/5') : 'border-info/30 bg-info/5'}`}>
                  <div className="flex items-center justify-between mb-2">
                    <div className="flex items-center gap-2">
                      <span className="text-xs font-semibold text-text-primary">{l.trade.stock} ({l.trade.code})</span>
                      <span className={`badge ${l.trade.direction.includes('买') ? 'bg-fall/20 text-fall' : 'bg-rise/20 text-rise'}`}>{l.trade.direction}</span>
                      <span className="text-[11px] text-text-muted">{l.trade.time}</span>
                    </div>
                    {l.assessment.score && <span className="text-xs font-mono font-bold text-warn">{l.assessment.score}</span>}
                  </div>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-2 text-[11px]">
                    <div>
                      {l.assessment.technical && <p className="text-text-muted">技术面: <span className="text-text-secondary">{l.assessment.technical}</span></p>}
                      {l.assessment.sector && <p className="text-text-muted">板块: <span className="text-info">{l.assessment.sector}</span></p>}
                      {l.assessment.trigger && <p className="text-text-muted">触发: <span className="text-text-secondary">{l.assessment.trigger}</span></p>}
                    </div>
                    <div>
                      <p className="text-text-muted">结论: <span className="text-warn font-medium">{l.assessment.conclusion}</span></p>
                      {l.assessment.stop_loss && <p className="text-text-muted">止损: <span className="text-rise font-mono">{l.assessment.stop_loss}</span></p>}
                      {l.assessment.target && <p className="text-text-muted">目标: <span className="text-fall font-mono">{l.assessment.target}</span></p>}
                      {l.assessment.realized_loss != null && <p className="text-text-muted">实现亏损: <span className="text-rise font-mono">¥{l.assessment.realized_loss}</span></p>}
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </Card>
        );
      })()}

      {/* 次日预期区域 */}
      {(() => {
        const logs = disciplineLog.logs || [];
        const today = new Date().toISOString().slice(0,10);
        const todayLogs = logs.filter(l => l.date === today && l.next_day_outlook);
        if (todayLogs.length === 0) return null;
        return (
          <Card>
            <h3 className="text-sm font-semibold mb-3">🔮 次日预期</h3>
            <div className="space-y-2">
              {todayLogs.map((l, i) => {
                const o = l.next_day_outlook;
                const dirColor = (o.direction||'').includes('涨') || (o.direction||'').includes('多') ? 'text-rise' : (o.direction||'').includes('跌') || (o.direction||'').includes('空') ? 'text-fall' : 'text-warn';
                return (
                  <div key={i} className="p-3 rounded-lg border border-border-main/50 bg-bg-card/30">
                    <div className="flex items-center gap-2 mb-2">
                      <span className="text-xs font-semibold text-text-primary">{l.trade.stock} ({l.trade.code})</span>
                      <span className={`text-xs font-mono font-bold ${dirColor}`}>{o.direction}</span>
                    </div>
                    <div className="flex flex-wrap gap-x-4 gap-y-1 text-[11px]">
                      {o.range && <span className="text-text-muted">预期区间: <span className="text-text-primary font-mono">{o.range}</span></span>}
                      {o.reason && <span className="text-text-muted">逻辑: <span className="text-text-secondary">{o.reason}</span></span>}
                    </div>
                  </div>
                );
              })}
            </div>
          </Card>
        );
      })()}

      <Card>
        <h3 className="text-sm font-semibold mb-3">风控规则状态</h3>
        <div className="space-y-2">
          {rules.map((r, i) => (
            <div key={i} className={`flex items-center justify-between p-2 rounded ${r.passed ? 'bg-fall/5' : 'bg-rise/5'}`}>
              <div className="flex items-center gap-2">
                <span>{r.passed ? Icons.circleCheck('w-4 h-4') : Icons.xCircle('w-4 h-4')}</span>

function PricesPage({ watchlistData, positions, searchQuery, setSearchQuery }) {
  const wl = watchlistData.watchlist || [];
  const pos = positions.positions || [];
  const posCodes = new Set(pos.map(p => p.code));

  const priceTable = wl.map(w => {
    const kp = w.key_price || {};
    const posItem = pos.find(p => p.code === w.code);
    return {
      ...w,
      support: kp.support || '-',
      resistance: kp.resistance || '-',
      buy_range: kp.buy_range || ['-', '-'],
      stop_loss: posItem ? (posItem.stop_loss || '-') : '-',
      stop_profit: posItem ? (posItem.stop_profit || '-') : '-',
      isPosition: posCodes.has(w.code),
    };
  });

  const filtered = priceTable.filter(w =>
    (w.name||'').includes(searchQuery) || (w.code||'').includes(searchQuery)
  );

  return (
    <div className="space-y-5">
      <Card>
        <div className="flex items-center justify-between mb-4">
          <h3 className="text-base font-semibold">关键价位快查</h3>

        <div className="relative mb-4">
          <span className="absolute left-3 top-1/2 -translate-y-1/2 text-text-muted">{Icons.search("w-4 h-4")}</span>
          <input type="text" placeholder="搜索股票代码或名称..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)}
            className="w-full pl-10 pr-4 py-2 bg-bg-card border border-border-main rounded-lg text-xs text-text-primary placeholder-text-muted focus:outline-none focus:border-info transition-colors" />
        </div>
        <div className="overflow-x-auto">
          <table className="w-full text-xs">
            <thead>
              <tr className="text-text-muted border-b border-border-main">
                <th className="text-left py-2 px-2">股票</th>
                <th className="text-right py-2 px-2">支撑位</th>
                <th className="text-right py-2 px-2">买入区间</th>
                <th className="text-right py-2 px-2">止损</th>
                <th className="text-right py-2 px-2">止盈</th>
                <th className="text-right py-2 px-2">阻力</th>
                <th className="text-left py-2 px-2">板块</th>
              </tr>
            </thead>
            <tbody>
              {filtered.map(w => (
                <tr key={w.code} className="border-b border-border-main/50 hover:bg-bg-hover/50 transition-colors">
                  <td className="py-3 px-2">
                    <span className="font-medium text-text-primary">{w.name}</span>
                    <span className="text-text-muted ml-1">{w.code}</span>

                  <td className="text-right py-3 px-2 font-mono text-fall">{w.support}</td>
                  <td className="text-right py-3 px-2 font-mono text-info">{w.buy_range[0]} - {w.buy_range[1]}</td>
                  <td className="text-right py-3 px-2 font-mono text-rise">{w.stop_loss}</td>
                  <td className="text-right py-3 px-2 font-mono text-fall">{w.stop_profit}</td>
                  <td className="text-right py-3 px-2 font-mono text-warn">{w.resistance}</td>

        <h3 className="text-sm font-semibold mb-4">数据新鲜度 & 刷新</h3>
        <div className="space-y-5">
          <div className="flex items-center justify-between p-3 rounded bg-bg-card/50 border border-border-main/50">
            <div className="flex items-center gap-3">
              <span className={`signal-dot ${refreshing ? 'signal-yellow' : Object.keys(errors).length > 0 ? 'signal-red' : 'signal-green'}`}></span>
              <div>
                <p className="text-xs font-medium text-text-primary">全局刷新</p>
                <p className="text-[11px] text-text-muted">数据源: {dataKeys.length}个JSON · 错误: {Object.keys(errors).length}个</p>
              </div>
            </div>
            <button onClick={handleRefreshAll} disabled={refreshing} className="px-3 py-1.5 border border-blue-500/40 text-blue-400 hover:bg-blue-500/10 rounded text-xs font-medium transition-colors cursor-pointer flex items-center gap-1 active:scale-[0.97] disabled:opacity-50">
              {Icons.refresh("w-3 h-3")} {refreshing ? '刷新中...' : '刷新全部'}
            </button>
          </div>
          {dataKeys.map(key => (
            <div key={key} className="flex items-center justify-between p-3 rounded bg-bg-card/50 border border-border-main/50">
              <div className="flex items-center gap-3">
                <span className={`signal-dot ${errors[key] ? 'signal-red' : getFreshness(lastFetch[key]) === 'green' ? 'signal-green' : getFreshness(lastFetch[key]) === 'yellow' ? 'signal-yellow' : 'signal-red'}`}></span>
                <div>
                  <p className="text-xs text-text-primary">{DATA_LABELS[key]}</p>
                  <p className="text-[11px] text-text-muted">
                    {errors[key] ? `错误: ${errors[key]}` : lastFetch[key] ? `更新: ${lastFetch[key].replace('T',' ').slice(0,19)}` : '未加载'}
                  </p>
                </div>
              </div>
              <div className="flex items-center gap-2">
                <FreshnessBadge fresh={errors[key] ? 'dark' : getFreshness(lastFetch[key])} />
                <button onClick={() => fetchOne(key)} className="p-1 text-slate-400 hover:text-slate-200 hover:bg-slate-700/50 rounded transition-colors cursor-pointer active:scale-[0.97]">
                  {Icons.refresh("w-3.5 h-3.5")}
                </button>
              </div>
            </div>
          ))}
        </div>
      </Card>

      <Card>
        <h3 className="text-sm font-semibold mb-4">系统信息</h3>
        <div className="space-y-2 text-xs">
          <div className="flex justify-between"><span className="text-text-muted">版本</span><span className="font-mono text-text-primary">V3.0 功能版</span></div>
          <div className="flex justify-between"><span className="text-text-muted">数据文件数</span><span className="font-mono text-text-primary">14</span></div>
          <div className="flex justify-between"><span className="text-text-muted">数据模式</span><span className="badge bg-fall/20 text-fall">实时数据</span></div>
          <div className="flex justify-between"><span className="text-text-muted">账户</span><span className="text-text-primary">交易员K</span></div>
        </div>
      </Card>
    </div>
  );
}

// ============ MODALS ============

    <div className="fixed inset-0 z-[100] flex items-center justify-center modal-overlay" onClick={onClose}>
      <div className="glass rounded-xl p-6 w-full max-w-md mx-4" onClick={e => e.stopPropagation()}>
        <div className="flex items-center justify-between mb-4">
          <h3 className="text-base font-semibold">录入成本价</h3>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-200 hover:bg-slate-700/50 rounded p-1 cursor-pointer transition-colors active:scale-[0.97]">{Icons.x("w-5 h-5")}</button>
        </div>
        <div className="space-y-5">
          <div>
            <label className="text-[11px] text-text-muted block mb-1">股票代码</label>
            <input type="text" placeholder="如: 300136" className="w-full px-3 py-2 bg-bg-primary border border-border-main rounded text-xs text-text-primary focus:outline-none focus:border-info" />
          </div>
          <div>
            <label className="text-[11px] text-text-muted block mb-1">股票名称</label>
            <input type="text" placeholder="如: 信维通信" className="w-full px-3 py-2 bg-bg-primary border border-border-main rounded text-xs text-text-primary focus:outline-none focus:border-info" />
          </div>
          <div className="grid grid-cols-2 gap-4">
            <div>
              <label className="text-[11px] text-text-muted block mb-1">成本价 (元)</label>
              <input type="number" placeholder="60.70" className="w-full px-3 py-2 bg-bg-primary border border-border-main rounded text-xs text-text-primary font-mono focus:outline-none focus:border-info" />
            </div>
            <div>
              <label className="text-[11px] text-text-muted block mb-1">数量 (股)</label>
              <input type="number" placeholder="1200" className="w-full px-3 py-2 bg-bg-primary border border-border-main rounded text-xs text-text-primary font-mono focus:outline-none focus:border-info" />
            </div>
          </div>
          <div className="grid grid-cols-2 gap-4">
            <div>
              <label className="text-[11px] text-text-muted block mb-1">止损价</label>
              <input type="number" placeholder="56.00" className="w-full px-3 py-2 bg-bg-primary border border-border-main rounded text-xs text-text-primary font-mono focus:outline-none focus:border-info" />
            </div>
            <div>
              <label className="text-[11px] text-text-muted block mb-1">止盈价</label>
              <input type="number" placeholder="72.00" className="w-full px-3 py-2 bg-bg-primary border border-border-main rounded text-xs text-text-primary font-mono focus:outline-none focus:border-info" />
            </div>
          </div>
          <div>
            <label className="text-[11px] text-text-muted block mb-1">买入日期</label>
            <input type="date" className="w-full px-3 py-2 bg-bg-primary border border-border-main rounded text-xs text-text-primary font-mono focus:outline-none focus:border-info" />
          </div>
          <button className="w-full py-2 bg-blue-600 hover:bg-blue-500 text-white rounded text-xs font-medium transition-colors cursor-pointer active:scale-[0.97]">
            确认录入
          </button>
          <p className="text-[11px] text-text-muted text-center">※ 此为演示功能，录入不会实际保存到数据文件</p>

function AvoidModal({ onClose, onAdd }) {
  const [form, setForm] = useState({ code: '', name: '', reason: '' });

  const handleSubmit = () => {
    if (!form.code || !form.name) return;
    onAdd({
      code: form.code,
      name: form.name,
      reason: form.reason || '手动添加',
      added_date: new Date().toISOString().slice(0, 10),
      tags: ['手动添加'],
    });
    onClose();
  };

  return (
    <div className="fixed inset-0 z-[100] flex items-center justify-center modal-overlay" onClick={onClose}>
      <div className="glass rounded-xl p-6 w-full max-w-md mx-4" onClick={e => e.stopPropagation()}>
        <div className="flex items-center justify-between mb-4">
          <h3 className="text-base font-semibold">添加回避名单</h3>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-200 hover:bg-slate-700/50 rounded p-1 cursor-pointer transition-colors active:scale-[0.97]">{Icons.x("w-5 h-5")}</button>
        </div>
        <div className="space-y-5">
          <div>
            <label className="text-[11px] text-text-muted block mb-1">股票代码</label>
            <input type="text" placeholder="如: 000001" value={form.code} onChange={e => setForm({...form, code: e.target.value})}
              className="w-full px-3 py-2 bg-bg-primary border border-border-main rounded text-xs text-text-primary focus:outline-none focus:border-info" />
          </div>
          <div>
            <label className="text-[11px] text-text-muted block mb-1">股票名称</label>
            <input type="text" placeholder="如: 平安银行" value={form.name} onChange={e => setForm({...form, name: e.target.value})}
              className="w-full px-3 py-2 bg-bg-primary border border-border-main rounded text-xs text-text-primary focus:outline-none focus:border-info" />
          </div>
          <div>
            <label className="text-[11px] text-text-muted block mb-1">回避理由</label>
            <textarea rows={3} placeholder="详细说明回避理由..." value={form.reason} onChange={e => setForm({...form, reason: e.target.value})}
              className="w-full px-3 py-2 bg-bg-primary border border-border-main rounded text-xs text-text-primary focus:outline-none focus:border-info resize-none" />
          </div>
          <button onClick={handleSubmit} className="w-full py-2 bg-blue-600 hover:bg-blue-500 text-white rounded text-xs font-medium transition-colors cursor-pointer active:scale-[0.97]">
            确认添加
          </button>
          <p className="text-[11px] text-text-muted text-center">※ 本地添加将保存在浏览器 localStorage</p>
        </div>
      </div>
    </div>
  );
}

// ============ RENDER ============
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
